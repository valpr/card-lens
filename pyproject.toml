[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cardlens"
version = "1.0.0"
description = "Turn any image, screenshot, or manga panel into rich Anki cards in seconds with Google Lens OCR & Yomitan."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "valpr" }
]
keywords = ["anki", "yomitan", "japanese", "ocr", "google-lens", "language-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Topic :: Education",
    "Topic :: Multimedia :: Graphics :: Capture",
]
dependencies = [
    "starlette>=0.30.0",
    "uvicorn>=0.22.0",
    "chrome-lens-py>=0.4.0",
    "pillow>=10.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
cardlens = "main:cli"

[project.urls]
Homepage = "https://github.com/valpr/card-lens"
Repository = "https://github.com/valpr/card-lens"
"Bug Tracker" = "https://github.com/valpr/card-lens/issues"

[tool.setuptools.package-data]
"*" = ["frontend/**/*"]
