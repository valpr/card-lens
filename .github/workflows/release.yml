name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-binaries:
    name: Build Desktop Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: CardLens-Windows-x64.zip
            binary_path: dist/CardLens.exe
          - os: macos-latest
            artifact_name: CardLens-macOS.zip
            binary_path: dist/CardLens
          - os: ubuntu-latest
            artifact_name: CardLens-Linux-x64.tar.gz
            binary_path: dist/CardLens

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build executable with PyInstaller
        run: |
          pyinstaller cardlens.spec

      - name: Package Windows Artifact
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/CardLens.exe -DestinationPath ${{ matrix.artifact_name }}

      - name: Package macOS Artifact
        if: matrix.os == 'macos-latest'
        run: |
          chmod +x dist/CardLens
          zip -j ${{ matrix.artifact_name }} dist/CardLens

      - name: Package Linux Artifact
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x dist/CardLens
          tar -czvf ${{ matrix.artifact_name }} -C dist CardLens

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: ${{ matrix.artifact_name }}

  build-docker:
    name: Build & Push Docker Image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-release:
    name: Publish GitHub Release
    needs: [build-binaries, build-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/CardLens-Windows-x64.zip
            artifacts/CardLens-macOS.zip
            artifacts/CardLens-Linux-x64.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
